services:

  db:
    image: postgres:16
    container_name: finance_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-financial_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financial_tracker}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-financial_tracker} -d ${POSTGRES_DB:-financial_tracker}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${APP_PORT:-8000}:8000"

    depends_on:
      db:
        condition: service_healthy

    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
